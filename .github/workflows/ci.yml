name: Build, Test, and Publish

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy upstream CliWrap source
        run: make vendor

      - name: Setup dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Restore tools
        if: github.event_name == 'pull_request'
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build solution
        run: dotnet build -c Release --no-restore

      - name: Run tests
        run: dotnet test -c Release --collect:"XPlat Code Coverage" --no-build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Lint solution
        if: github.event_name == 'pull_request'
        run: dotnet fantomas --check src

      - name: Run F# analyzers
        run: .config/analyzers/analyze.sh --report analyzers.sarif

      - name: Upload analyzer results to code scanning
        if: always() && hashFiles('analyzers.sarif') != ''
        continue-on-error: true # fork PRs get a read-only token
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: analyzers.sarif
          category: fsharp-analyzers

  release:
    if: github.event_name == 'push'
    needs: ["build"]
    permissions: {}
    uses: unmango/actions/.github/workflows/release-please.yml@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  pack:
    runs-on: ubuntu-latest
    if: needs.release.outputs.release_created == 'true'
    needs: ["release"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - run: dotnet restore src/CliWrap.FSharp --locked-mode

      # This run checked out the release PR's merge commit before its tag existed,
      # so MinVer alone would compute a prerelease version.
      - name: Package library
        run: dotnet pack src/CliWrap.FSharp -c Release -o out --no-restore -p:MinVerVersionOverride="$VERSION"
        env:
          VERSION: ${{ needs.release.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget
          path: out/*.nupkg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: ["pack"]
    strategy:
      matrix:
        source: ["nuget", "github"]
    env:
      PACKAGE_PATTERN: UnMango.CliWrap.FSharp.*.nupkg
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: UnstoppableMango

      - name: Publish to NuGet.org
        if: matrix.source == 'nuget'
        run: | # zizmor: ignore[use-trusted-publishing] NuGet/login is trusted publishing
          dotnet nuget push "$PACKAGE_PATTERN" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Authenticate to GitHub Packages
        if: matrix.source == 'github'
        run: |
          dotnet nuget add source \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish to GitHub Packages
        if: matrix.source == 'github'
        run: | # zizmor: ignore[use-trusted-publishing] GitHub Packages has no trusted publishing
          dotnet nuget push "$PACKAGE_PATTERN" \
            --source ${{ matrix.source }} \
            --skip-duplicate

  # Ensure the devcontainer can build the library
  devcontainer:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: make build

  nix:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - run: nix flake check
      - run: nix build .#
